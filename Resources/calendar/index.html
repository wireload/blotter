<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
	<title>Project title</title>
	<link media="all" type="text/css" rel="stylesheet" href="css/all.css" />
	<!--[if lt IE 8]><link rel="stylesheet" type="text/css" href="css/ie.css"/><![endif]-->
</head>
<body>
  <script src="jquery-1.4.4.min.js"></script>
  <script src="calendar-compiled.js"></script>
  <script>
  $(document).ready(function() {
    window.setTimeout(function() {
      var json = {{ json }};
      update(json);
    }, 1.0);
  });
  </script>

  <div id='glass-border'>
    <div id='glass-pane'>
			<div id="main">
				<div class="info">
					<div class="date" id='date-box'>
						<p><strong>{{ calendar.date | date_format:"d" }}</strong></p>
						<p>{{ calendar.date | date_format:"MMMM" }}, {{ calendar.date | date_format:"y"}}</p>
						<p>{{ calendar.date | date_format:"EEEE" }}</p>
					</div>
					<div class="info-boxes-space">
  					<div class="box" id="to-do-box">
  						<div>
  							<h1>To do</h1>
  							<ul>
  							  {% for task in calendar.tasks %}
  							  <li>{{ task.title }}</li>
  							  {% /for %}
  							</ul>
  						</div>
  					</div>
  					<div class="box" id="next-up-box">
  					  <div>
  							<h2>Next Up</h2>
  							<div class="calendar">
          				<div class="main-table main-table-underlay ">
          					<div class='calendar-wrapper'>
            					<table>
            						<tr>
            							<td class="timeline"><div></div></td>
            							<td><div></div></td>
            						</tr>
            					</table>
          					</div>
          				</div>
          				<div class="main-table">
          					<div class='calendar-wrapper'>
          					  <table>
            						<tr>
            							<th class="timeline"></th>
            							<th><span></span></th>
            						</tr>
            						<tr>
            							<td class="timeline content-column"><div id="next-up-timeline"></div></td>
            							<td class="content-column"><div id="next-up-content-0"></div></td>
                        </tr>
            					</table>
            				</div>
            			</div>
            		</div>
  						</div>
  					</div>
					</div>
				</div>
				<div class="main-table main-table-underlay calendar">
					<table class="top-table">
						<tr>
							<td class="timeline">&nbsp;</td>
							<td><div>&nbsp;</div></td>
							<td><div>&nbsp;</div></td>
							<td><div>&nbsp;</div></td>
							<td><div>&nbsp;</div></td>
							<td><div>&nbsp;</div></td>
							<td><div>&nbsp;</div></td>
							<td><div>&nbsp;</div></td>
						</tr>
					</table>
					<div class='calendar-wrapper'>
  					<table class="calendar">
  						<tr>
  							<td class="timeline"><div></div></td>
  							<td><div></div></td>
  							<td><div></div></td>
  							<td><div></div></td>
  							<td><div></div></td>
  							<td><div></div></td>
  							<td><div></div></td>
  							<td><div></div></td>
  						</tr>
  					</table>
					</div>
				</div>
				<div class="main-table calendar">
					<table class="top-table">
						<tr>
							<td class="timeline"><div></div></td>
							<td class="content-column"><div id="main-all-day-0">&nbsp;</div></td>
							<td class="content-column"><div id="main-all-day-1"></div></td>
							<td class="content-column"><div id="main-all-day-2"></div></td>
							<td class="content-column"><div id="main-all-day-3"></div></td>
							<td class="content-column"><div id="main-all-day-4"></div></td>
							<td class="content-column"><div id="main-all-day-5"></div></td>
							<td class="content-column"><div id="main-all-day-6"></div></td>
						</tr>
					</table>
					<div class='calendar-wrapper'>
					  <table class="calendar">
  						<tr>
  							<th class="timeline"></th>
  							<th><span id="main-header-0"></span></th>
  							<th><span id="main-header-1"></span></th>
  							<th><span id="main-header-2"></span></th>
  							<th><span id="main-header-3"></span></th>
  							<th><span id="main-header-4"></span></th>
  							<th><span id="main-header-5"></span></th>
  							<th><span id="main-header-6"></span></th>
  						</tr>
  						<tr>
  							<td class="timeline content-column"><div id="main-timeline"></div></td>
  							<td class="content-column"><div id="main-content-0"></div></td>
  							<td class="content-column"><div id="main-content-1"></div></td>
  							<td class="content-column"><div id="main-content-2"></div></td>
  							<td class="content-column"><div id="main-content-3"></div></td>
  							<td class="content-column"><div id="main-content-4"></div></td>
  							<td class="content-column"><div id="main-content-5"></div></td>
  							<td class="content-column"><div id="main-content-6"></div></td>
  						</tr>
  					</table>
					</div>
				</div>
			</div>
		</div>
  </body>
</html>
