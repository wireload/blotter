name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  XCODE_VERSION: "26.6"
  XCODEGEN_VERSION: "2.44.1"

jobs:
  kit-linux:
    name: BlotterKit (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test --package-path BlotterKit

  app:
    name: Lint, build & test (macOS)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          xcodebuild -version
          # Report every compile error in a run rather than stopping at the first one.
          defaults write com.apple.dt.Xcode IDEBuildingContinueBuildingAfterErrors -bool YES

      - name: swift-format
        run: swift format lint --strict -r Blotter BlotterKit/Sources BlotterKit/Tests BlotterKit/Package.swift

      - name: Xcode project matches project.yml
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen"
          git diff --exit-code -- Blotter.xcodeproj Blotter/Info.plist Blotter/Blotter.entitlements

      - name: Test BlotterKit
        run: swift test --package-path BlotterKit

      - name: Build and test
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild test \
            -project Blotter.xcodeproj \
            -scheme Blotter \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/Blotter.xcresult \
            -skipMacroValidation \
            CODE_SIGN_IDENTITY=- \
            | tee build/xcodebuild-test.log | xcbeautify --renderer github-actions

      - name: Build Release app
        run: |
          set -o pipefail
          xcodebuild build \
            -project Blotter.xcodeproj \
            -scheme Blotter \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/DerivedData \
            -skipMacroValidation \
            CODE_SIGN_IDENTITY=- \
            | tee build/xcodebuild-release.log | xcbeautify --renderer github-actions
          ditto -c -k --keepParent build/DerivedData/Build/Products/Release/Blotter.app build/Blotter.zip

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Blotter
          path: build/Blotter.zip

      - name: Upload logs and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-logs
          path: |
            build/*.log
            build/*.xcresult
            Blotter.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          if-no-files-found: ignore
