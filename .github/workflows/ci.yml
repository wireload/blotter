name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build & test (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15]
    env:
      # CI has no Developer ID; build ad-hoc signed without hardened runtime so
      # the hosted test bundle can be injected into Blotter.app.
      XCODE_FLAGS: >-
        CODE_SIGN_IDENTITY=-
        CODE_SIGN_STYLE=Manual
        DEVELOPMENT_TEAM=
        PROVISIONING_PROFILE_SPECIFIER=
        ENABLE_HARDENED_RUNTIME=NO
        COMPILER_INDEX_STORE_ENABLE=NO
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Xcode version
        run: |
          # Report every compile error in a run rather than stopping at the first one.
          defaults write com.apple.dt.Xcode IDEBuildingContinueBuildingAfterErrors -bool YES
          xcodebuild -version
          xcrun --show-sdk-version

      - name: Test WLFoundation
        run: |
          set -o pipefail
          xcodebuild test \
            -workspace Blotter.xcworkspace \
            -scheme WLFoundation \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/WLFoundation.xcresult \
            $XCODE_FLAGS | tee build-wlfoundation.log | xcbeautify --renderer github-actions || exit 1

      - name: Test Blotter
        run: |
          set -o pipefail
          xcodebuild test \
            -workspace Blotter.xcworkspace \
            -scheme Blotter \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/Blotter.xcresult \
            $XCODE_FLAGS | tee build-blotter.log | xcbeautify --renderer github-actions

      - name: Upload logs and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-${{ matrix.runner }}
          path: |
            build-*.log
            build/*.xcresult
          if-no-files-found: ignore
